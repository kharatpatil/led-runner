<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#ffffff">
<title>LED Runner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Share+Tech+Mono&family=Major+Mono+Display&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0b0d10;
    --panel: #14171b;
    --panel-line: #23272d;
    --text-dim: #8a929c;
    --text: #e7ebee;
    --accent: #ffb000;   /* LED amber */
    --accent-dim: #7a5600;
    --radius: 3px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: "Share Tech Mono", ui-monospace, "Courier New", monospace;
  }

  body {
    display: flex;
    min-height: 100vh;
  }

  /* ---------- Control panel ---------- */
  #panel {
    width: 340px;
    min-width: 340px;
    background: var(--panel);
    border-right: 1px solid var(--panel-line);
    padding: 22px 20px 20px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  #panel h1 {
    font-family: "Major Mono Display", monospace;
    font-size: 20px;
    letter-spacing: 1px;
    margin: 0 0 2px;
    color: var(--accent);
    text-shadow: 0 0 8px rgba(255,176,0,0.5);
  }

  #panel .sub {
    color: var(--text-dim);
    font-size: 12px;
    margin: 0 0 6px;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .field label {
    font-size: 11px;
    color: var(--text-dim);
    display: flex;
    justify-content: space-between;
  }

  .field label span.val {
    color: var(--accent);
  }

  input[type="text"],
  select {
    background: #0d0f12;
    border: 1px solid var(--panel-line);
    color: var(--text);
    padding: 8px 10px;
    font-family: inherit;
    font-size: 13px;
    border-radius: var(--radius);
  }

  input[type="text"]:focus,
  select:focus {
    outline: none;
    border-color: var(--accent);
  }

  input[type="range"] {
    -webkit-appearance: none;
    width: 100%;
    height: 3px;
    background: var(--panel-line);
    border-radius: 2px;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    box-shadow: 0 0 6px rgba(255,176,0,0.7);
  }
  input[type="range"]::-moz-range-thumb {
    width: 14px;
    height: 14px;
    border: none;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    box-shadow: 0 0 6px rgba(255,176,0,0.7);
  }

  .color-row {
    display: flex;
    gap: 10px;
  }
  .color-field {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 8px;
    border: 1px solid var(--panel-line);
    border-radius: var(--radius);
    padding: 6px 8px;
    background: #0d0f12;
  }
  .color-field input[type="color"] {
    -webkit-appearance: none;
    width: 26px;
    height: 26px;
    border: none;
    background: none;
    cursor: pointer;
    padding: 0;
  }
  .color-field input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
  .color-field input[type="color"]::-webkit-color-swatch { border: 1px solid var(--panel-line); border-radius: 50%; }
  .color-field span { font-size: 11px; color: var(--text-dim); }

  .row2 {
    display: flex;
    gap: 10px;
  }
  .row2 > .field { flex: 1; }

  .toggle-row {
    display: flex;
    gap: 8px;
  }
  .toggle-btn {
    flex: 1;
    padding: 8px 6px;
    background: #0d0f12;
    border: 1px solid var(--panel-line);
    color: var(--text-dim);
    font-family: inherit;
    font-size: 12px;
    border-radius: var(--radius);
    cursor: pointer;
  }
  .toggle-btn.active {
    color: var(--accent);
    border-color: var(--accent-dim);
    background: rgba(255,176,0,0.08);
  }

  #actions {
    margin-top: auto;
    display: flex;
    gap: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--panel-line);
  }

  button.main-btn {
    flex: 1;
    padding: 11px 10px;
    border-radius: var(--radius);
    border: 1px solid var(--panel-line);
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
    background: #0d0f12;
    color: var(--text);
  }
  #playBtn {
    background: var(--accent);
    color: #17130a;
    border-color: var(--accent);
    font-weight: bold;
  }
  #playBtn.playing {
    background: #0d0f12;
    color: var(--accent);
    border-color: var(--accent-dim);
  }

  /* ---------- Display area ---------- */
  #stage-wrap {
    flex: 1;
    position: relative;
    background: #000;
  }

  #stage {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  #fsBtn {
    position: absolute;
    top: 16px;
    right: 16px;
    background: rgba(20,23,27,0.75);
    border: 1px solid var(--panel-line);
    color: var(--text-dim);
    font-family: inherit;
    font-size: 11px;
    padding: 7px 12px;
    border-radius: var(--radius);
    cursor: pointer;
    z-index: 5;
  }
  #fsBtn:hover { color: var(--text); }

  @media (max-width: 760px) {
    body { flex-direction: column; }
    #panel { width: 100%; min-width: 0; border-right: none; border-bottom: 1px solid var(--panel-line); max-height: 60vh; }
    #stage-wrap { min-height: 40vh; }
  }
</style>
</head>
<body>

  <div id="panel">
    <div>
      <h1>LED RUNNER</h1>
      <p class="sub">Configure your scrolling sign</p>
    </div>

    <div class="field">
      <label for="textInput">Message</label>
      <input type="text" id="textInput" value="WELCOME TO LED RUNNER!" maxlength="200">
    </div>

    <div class="field">
      <label for="fontSelect">Font</label>
      <select id="fontSelect">
        <option value="'VT323', monospace">VT323 (LED style)</option>
        <option value="'Share Tech Mono', monospace" selected>Share Tech Mono</option>
        <option value="'Major Mono Display', monospace">Major Mono Display</option>
        <option value="'Courier New', monospace">Courier New</option>
        <option value="Arial, sans-serif">Arial</option>
        <option value="Georgia, serif">Georgia</option>
        <option value="'Times New Roman', serif">Times New Roman</option>
        <option value="Impact, sans-serif">Impact</option>
      </select>
    </div>

    <div class="row2">
      <div class="field">
        <label for="sizeRange">Size <span class="val" id="sizeVal">120px</span></label>
        <input type="range" id="sizeRange" min="20" max="300" value="120">
      </div>
      <div class="field">
        <label for="speedRange">Speed <span class="val" id="speedVal">5</span></label>
        <input type="range" id="speedRange" min="1" max="20" value="5">
      </div>
    </div>

    <div class="field">
      <label>Colors</label>
      <div class="color-row">
        <div class="color-field">
          <input type="color" id="textColor" value="#ffb000">
          <span>Text</span>
        </div>
        <div class="color-field">
          <input type="color" id="bgColor" value="#000000">
          <span>Background</span>
        </div>
      </div>
    </div>

    <div class="field">
      <label>Direction</label>
      <div class="toggle-row">
        <button class="toggle-btn active" data-dir="rtl">◀ Right→Left</button>
        <button class="toggle-btn" data-dir="ltr">Left→Right ▶</button>
      </div>
    </div>

    <div class="field">
      <label>Glow effect</label>
      <div class="toggle-row">
        <button class="toggle-btn active" data-glow="on">On</button>
        <button class="toggle-btn" data-glow="off">Off</button>
      </div>
    </div>

    <div id="actions">
      <button class="main-btn" id="playBtn">Pause</button>
      <button class="main-btn" id="resetBtn">Reset</button>
    </div>
  </div>

  <div id="stage-wrap">
    <button id="fsBtn">⛶ Fullscreen</button>
    <canvas id="stage"></canvas>
  </div>

<script>
(function(){
  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d');
  const stageWrap = document.getElementById('stage-wrap');

  const state = {
    text: document.getElementById('textInput').value,
    font: document.getElementById('fontSelect').value,
    size: parseInt(document.getElementById('sizeRange').value, 10),
    speed: parseInt(document.getElementById('speedRange').value, 10),
    textColor: document.getElementById('textColor').value,
    bgColor: document.getElementById('bgColor').value,
    dir: 'rtl',
    glow: true,
    playing: true,
    x: 0,
    textWidth: 0,
    dpr: window.devicePixelRatio || 1
  };

  function resizeCanvas(){
    const w = stageWrap.clientWidth;
    const h = stageWrap.clientHeight;
    state.dpr = window.devicePixelRatio || 1;
    canvas.width = w * state.dpr;
    canvas.height = h * state.dpr;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
    measureText();
  }

  function measureText(){
    ctx.font = `${state.size}px ${state.font}`;
    state.textWidth = ctx.measureText(state.text || ' ').width;
  }

  function resetPosition(){
    const w = stageWrap.clientWidth;
    if (state.dir === 'rtl') {
      state.x = w;
    } else {
      state.x = -state.textWidth;
    }
  }

  function draw(){
    const w = stageWrap.clientWidth;
    const h = stageWrap.clientHeight;

    ctx.fillStyle = state.bgColor;
    ctx.fillRect(0, 0, w, h);

    ctx.font = `${state.size}px ${state.font}`;
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'left';

    if (state.glow) {
      ctx.shadowColor = state.textColor;
      ctx.shadowBlur = Math.max(8, state.size * 0.18);
    } else {
      ctx.shadowBlur = 0;
    }

    ctx.fillStyle = state.textColor;
    ctx.fillText(state.text || ' ', state.x, h / 2);

    // draw a second faint pass for extra glow depth
    if (state.glow) {
      ctx.shadowBlur = Math.max(16, state.size * 0.35);
      ctx.globalAlpha = 0.5;
      ctx.fillText(state.text || ' ', state.x, h / 2);
      ctx.globalAlpha = 1;
    }
  }

  function step(){
    if (state.playing) {
      const w = stageWrap.clientWidth;
      const dx = state.dir === 'rtl' ? -state.speed : state.speed;
      state.x += dx;

      if (state.dir === 'rtl' && state.x + state.textWidth < 0) {
        state.x = w;
      } else if (state.dir === 'ltr' && state.x > w) {
        state.x = -state.textWidth;
      }
    }
    draw();
    requestAnimationFrame(step);
  }

  // ---- wire up controls ----
  const textInput = document.getElementById('textInput');
  const fontSelect = document.getElementById('fontSelect');
  const sizeRange = document.getElementById('sizeRange');
  const speedRange = document.getElementById('speedRange');
  const sizeVal = document.getElementById('sizeVal');
  const speedVal = document.getElementById('speedVal');
  const textColor = document.getElementById('textColor');
  const bgColor = document.getElementById('bgColor');
  const playBtn = document.getElementById('playBtn');
  const resetBtn = document.getElementById('resetBtn');
  const fsBtn = document.getElementById('fsBtn');

  textInput.addEventListener('input', () => {
    state.text = textInput.value;
    measureText();
  });

  fontSelect.addEventListener('change', () => {
    state.font = fontSelect.value;
    measureText();
  });

  sizeRange.addEventListener('input', () => {
    state.size = parseInt(sizeRange.value, 10);
    sizeVal.textContent = state.size + 'px';
    measureText();
  });

  speedRange.addEventListener('input', () => {
    state.speed = parseInt(speedRange.value, 10);
    speedVal.textContent = state.speed;
  });

  textColor.addEventListener('input', () => { state.textColor = textColor.value; });
  bgColor.addEventListener('input', () => { state.bgColor = bgColor.value; });

  document.querySelectorAll('[data-dir]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('[data-dir]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      state.dir = btn.dataset.dir;
      resetPosition();
    });
  });

  document.querySelectorAll('[data-glow]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('[data-glow]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      state.glow = btn.dataset.glow === 'on';
    });
  });

  playBtn.addEventListener('click', () => {
    state.playing = !state.playing;
    playBtn.textContent = state.playing ? 'Pause' : 'Play';
    playBtn.classList.toggle('playing', state.playing);
  });

  resetBtn.addEventListener('click', () => {
    resetPosition();
  });

  fsBtn.addEventListener('click', () => {
    if (!document.fullscreenElement) {
      stageWrap.requestFullscreen().catch(() => {});
    } else {
      document.exitFullscreen();
    }
  });

  document.addEventListener('fullscreenchange', () => {
    resizeCanvas();
  });

  window.addEventListener('resize', resizeCanvas);

  // ---- init ----
  resizeCanvas();
  resetPosition();
  playBtn.classList.add('playing');
  requestAnimationFrame(step);
})();
</script>

</body>
</html>
